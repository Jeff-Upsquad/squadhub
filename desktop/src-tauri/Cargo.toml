[package]
name = "squadhub-desktop"
version = "0.1.0"
description = "SquadHub desktop companion — native notifications relay"
authors = ["SquadHub"]
edition = "2021"

[lib]
name = "squadhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
objc = "0.2"
block = "0.1"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
