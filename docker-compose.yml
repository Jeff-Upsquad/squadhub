services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: squadhub-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env.production
    environment:
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3080}
      - ADMIN_URL=${ADMIN_URL:-http://localhost:3081}
    networks:
      - squadhub

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_ADMIN_URL: ${ADMIN_URL:-http://localhost:3081}
    container_name: squadhub-web
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      - server
    networks:
      - squadhub

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_APP_URL: ${CLIENT_URL:-http://localhost:3080}
    container_name: squadhub-admin
    restart: unless-stopped
    ports:
      - "3081:80"
    depends_on:
      - server
    networks:
      - squadhub

networks:
  squadhub:
    driver: bridge
