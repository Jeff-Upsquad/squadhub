services:
  caddy:
    image: caddy:2
    container_name: squadhub-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - /var/www/profiles:/srv/profiles:ro
      - /var/www/attendanceapp:/srv/attendanceapp:ro
      - /var/www/cashbook-downloads:/srv/cashbook-downloads:ro
      - /var/www/partner-downloads:/srv/partner-downloads:ro
      - /var/www/kia:/srv/kia:ro
      - /var/www/cashbook-web:/srv/cashbook-web:ro
      - /var/www/rioconnect:/srv/rioconnect:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
      - admin
    networks:
      - squadhub

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: squadhub-server
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ./server/.env.production
    environment:
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-https://squadhub.in}
      - ADMIN_URL=${ADMIN_URL:-https://admin.squadhub.in}
      - CASHBOOK_URL=${CASHBOOK_URL:-https://cashbook.squadhub.in}
      - CASHBOOK_MIN_VERSION=${CASHBOOK_MIN_VERSION:-1.0.0}
      - CASHBOOK_DOWNLOAD_URL=${CASHBOOK_DOWNLOAD_URL:-}
      - PARTNER_APP_MIN_VERSION=${PARTNER_APP_MIN_VERSION:-1.0.0}
      - PARTNER_APP_DOWNLOAD_URL=${PARTNER_APP_DOWNLOAD_URL:-}
      # In-app updater manifest (GET /partner-app/version). Read from a mounted
      # host file (below) so `tools/release.sh` can update the version live by
      # writing that file — the server hot-reloads it (fs.watchFile), no redeploy.
      - PARTNER_RELEASE_MANIFEST_PATH=/data/partner-release-manifest.json
      # SOP auto-generator (admin "Auto-generate" button): drive the in-network
      # web app with the system Chromium, screenshotting as this account.
      - SOP_GEN_BASE_URL=${SOP_GEN_BASE_URL:-http://web:3000}
      - SOP_GEN_USER_EMAIL=${SOP_GEN_USER_EMAIL:-testlocal@test.com}
      - SOP_CHROMIUM_PATH=${SOP_CHROMIUM_PATH:-/usr/bin/chromium-browser}
    volumes:
      # Partner-app release manifest, editable live by tools/release.sh.
      - /var/www/partner-release-manifest.json:/data/partner-release-manifest.json:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - squadhub

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: squadhub-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${CLIENT_URL:-https://squadhub.in}
      - INTERNAL_API_URL=http://server:4000
    depends_on:
      - server
    networks:
      - squadhub

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: squadhub-admin
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${ADMIN_URL:-https://admin.squadhub.in}
      - INTERNAL_API_URL=http://server:4000
    depends_on:
      - server
    networks:
      - squadhub

  squadbooks:
    # Build from the SquadBooks repo first:  docker build -t squadbooks:latest .
    image: squadbooks:latest
    container_name: squadbooks
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./squadbooks.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - squadhub

volumes:
  caddy_data:
  caddy_config:

networks:
  squadhub:
    driver: bridge
