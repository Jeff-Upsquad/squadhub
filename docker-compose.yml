services:
  caddy:
    image: caddy:2
    container_name: squadhub-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin
    networks:
      - squadhub

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: squadhub-server
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ./server/.env.production
    environment:
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-https://squadhub.in}
      - ADMIN_URL=${ADMIN_URL:-https://admin.squadhub.in}
    networks:
      - squadhub

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_ADMIN_URL: ${ADMIN_URL:-https://admin.squadhub.in}
    container_name: squadhub-web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - squadhub

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_APP_URL: ${CLIENT_URL:-https://squadhub.in}
    container_name: squadhub-admin
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - squadhub

volumes:
  caddy_data:
  caddy_config:

networks:
  squadhub:
    driver: bridge
