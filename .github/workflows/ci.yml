name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Tenant-scope leak guard
        run: npm run check:tenant-scope

      - name: Build shared
        run: npm run build -w shared

      - name: Type-check server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Server tests (incl. cross-workspace isolation)
        run: npm test -w server

      - name: Validate the database baseline on a throwaway Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          PGHOST=127.0.0.1 PGUSER=postgres PGPASSWORD=postgres bash supabase/validate/validate_baseline.sh

      - name: Build server and web
        run: npm run build -w server && npm run build -w web
