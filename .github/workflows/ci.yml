name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Check shared admin imports
        run: npm run check:shared-imports

      - name: Type-check server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Build server, web, and admin
        run: npm run build -w server && npm run build -w web && npm run build -w admin
