name: Deploy

# Auto-deploys production after CI passes on main (i.e. after a PR merges).
# Runs the same tools/deploy.sh used by hand, so change detection, the VPS
# deploy lock, image tagging and rollback tags all behave identically.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VPS_SSH_KEY      private key of a deploy-only keypair whose public half is
#                    in root@72.61.245.97:~/.ssh/authorized_keys
#   VPS_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 72.61.245.97`, captured
#                    once from a trusted machine (pins the host key)
#
# DB migrations are NOT applied by deploy.sh. If the range being shipped adds
# files under supabase/migrations/, this workflow stops before deploying; apply
# the migration first, then re-run via "Run workflow" with migrations_applied.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      migrations_applied:
        description: I have already applied the new supabase/migrations to production
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once, and never cancel one mid-build.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy a main push whose CI succeeded (or a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets must be set (see the header of this workflow)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host 72.61.245.97
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Block unapplied migrations
        if: ${{ !inputs.migrations_applied }}
        run: |
          VPS_HEAD=$(ssh root@72.61.245.97 "cd /opt/squadhub && git rev-parse HEAD")
          echo "VPS is at ${VPS_HEAD:0:7}; shipping up to $(git rev-parse --short HEAD)"
          if ! git cat-file -e "$VPS_HEAD^{commit}" 2>/dev/null; then
            echo "::error::VPS commit $VPS_HEAD is not in main's history — deploy by hand and investigate."
            exit 1
          fi
          MIGRATIONS=$(git diff --name-only --diff-filter=A "$VPS_HEAD" HEAD -- supabase/migrations/)
          if [ -n "$MIGRATIONS" ]; then
            echo "::error::New DB migrations in this deploy — apply them to production first, then re-run this workflow with 'migrations_applied' ticked:"
            echo "$MIGRATIONS"
            exit 1
          fi
          echo "No new migrations."

      - name: Deploy
        run: bash tools/deploy.sh
