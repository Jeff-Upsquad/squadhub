[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
hilt = "2.53.1"
coroutines = "1.9.0"
lifecycle = "2.8.7"
compose-bom = "2024.12.01"
nav-compose = "2.8.5"
hilt-nav-compose = "1.2.0"
activity-compose = "1.9.3"
core-ktx = "1.15.0"
datastore = "1.1.1"
room = "2.6.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
